services:
  web:
    build: .
    image: inquisitor-web:1.0.0
    restart: unless-stopped
    env_file: .env
    environment:
      INQUISITOR_DATA_DIR: /srv/inquisitor/data
      INQUISITOR_PRODUCTION: "1"
      INQUISITOR_TRUST_PROXY: "1"
    volumes:
      - /srv/inquisitor/data:/srv/inquisitor/data
    ports:
      - "${INQUISITOR_HTTP_PORT:-8080}:8000"
    command: ["sh","-lc","python manage.py init && exec gunicorn --bind 0.0.0.0:8000 --workers 1 --threads 8 --timeout 60 --access-logfile - --error-logfile - wsgi:app"]
    healthcheck:
      test: ["CMD","curl","-fsS","http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    image: inquisitor-web:1.0.0
    restart: unless-stopped
    env_file: .env
    environment:
      INQUISITOR_DATA_DIR: /srv/inquisitor/data
      INQUISITOR_PRODUCTION: "1"
      INQUISITOR_JUDGE_BACKEND: docker
      INQUISITOR_JUDGE_IMAGE: inquisitor-judge-runtime:1.0
      INQUISITOR_JUDGE_WORK_ROOT: /srv/inquisitor/data/judge-work
    volumes:
      - /srv/inquisitor/data:/srv/inquisitor/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      web:
        condition: service_healthy
    command: ["python","worker.py"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
